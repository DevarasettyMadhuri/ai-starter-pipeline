version: "3.8"

services:
  db:
    image: postgres:latest
    container_name: devdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ai_customer_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/devdb
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - db

volumes:
  postgres_data:
