version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: devdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata_fresh:/var/lib/postgresql/data

  api:
    build: .
    container_name: ai_customer_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/devdb
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - db

  dashboard:
    build: .
    container_name: ai_dashboard
    restart: always
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/devdb
      - API_URL=http://api:8000/clean-record
    command: sh -c "pip install streamlit requests pandas sqlalchemy psycopg2-binary && streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - db
      - api

volumes:
  pgdata_fresh: